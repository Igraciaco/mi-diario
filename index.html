<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Diario</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Diario"><meta name="theme-color" content="#ff6b2c">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1a1d29;--mu:#6b7080;--ac:#ff6b2c;--ac2:#2c7bff;--ok:#1fa971;--bd:#e4e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mu:#9096aa;--bd:#2a2e3c}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f6;--mu:#9096aa;--bd:#2a2e3c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:80px}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:8px 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}button.b{background:var(--ac2)}button.g{background:var(--ok)}button.r{background:#d63b4a}
button.sm{padding:6px 10px;font-size:13px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:62px;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:11px;font-weight:500}
nav button.on{color:var(--ac)}nav span{display:block;font-size:20px}
label{font-size:13px;color:var(--mu);display:block;margin:6px 0 2px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script src="firebase-config.js"></script>
<script>
/* Fuera de Claude: sustituye las funciones de Claude por la API de Anthropic con tu propia clave */
if(!window.claude){
const KN='mi-diario-apikey';
const key=()=>{let k='';try{k=localStorage.getItem(KN)||''}catch(e){}
 if(!k){k=prompt('Pega tu clave de API de Anthropic (se guarda solo en este dispositivo):')||'';if(!k)throw{message:'Falta la clave de API'};try{localStorage.setItem(KN,k)}catch(e){}}return k};
const shrink=async b=>{const bm=await createImageBitmap(b),s=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.8).split(',')[1]};
const call=async content=>{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:800,messages:[{role:'user',content}]})});
 const j=await r.json();if(!r.ok)throw{message:(j.error&&j.error.message)||'Error de API'};return j.content.map(c=>c.text||'').join('')};
const sample=async(input,o={})=>{const c=[];for(const b of (o.images||[]))c.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await shrink(b)}});
 c.push({type:'text',text:typeof input==='string'?input:input.map(m=>m.content).join('\n')});return{text:await call(c)}};
sample.json=async(i,o)=>JSON.parse((await sample(i,o)).text.replace(/```json|```/g,'').trim());
sample.limits=async()=>({images:true});
const downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
window.claude={use:async n=>n==='sample'?sample:n==='downloads'?downloads:null};
}
</script>
<script>
const KEY='mi-diario-v1';
let S={p:{peso:70,alt:175,edad:17,sexo:'m'},wake:[],sleep:[],study:[],studyRun:null,sport:[],sportRun:null,food:[],health:{},period:[],weights:[],goal:2200,water:{},meas:[],exp:[],phone:{},train:{},tasks:[],diet:{mode:'mantener',rate:1}};
try{const x=localStorage.getItem(KEY);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{S._t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}window.cloudPush&&window.cloudPush()};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let tab='hoy',photo={busy:false,res:null,err:''};
const TABS=[['hoy','🏠','Hoy'],['estudio','📚','Estudio'],['deporte','🏀','Deporte'],['comida','🍽️','Comida'],['cuerpo','❤️','Cuerpo']];
TABS.push(['plan','🗓️','Plan'],['extra','💶','Gastos']);
TABS.push(['agenda','✅','Agenda']);
const MET={entreno:[6.5,'Entrenamiento'],partido:[8,'Partido'],calentamiento:[4.5,'Calentamiento']};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dk(Date.now());
const hm=t=>new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const fd=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const dur=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const clock=ms=>{const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const num=id=>parseFloat(document.getElementById(id)?.value)||0;
const bmr=()=>{const p=S.p;return Math.round(10*p.peso+6.25*p.alt-5*p.edad+(p.sexo==='m'?5:-161))};
const kcalSport=(type,min)=>Math.round(MET[type][0]*S.p.peso*min/60);
const studyMs=(day)=>S.study.filter(x=>dk(x.s)===day).reduce((a,x)=>a+x.e-x.s,0)+(S.studyRun&&dk(S.studyRun)===day?Date.now()-S.studyRun:0);
const sportToday=()=>S.sport.filter(x=>dk(x.t)===today());
const foodToday=()=>S.food.filter(x=>dk(x.t)===today());
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
function sleepLast(){const w=[...S.wake].sort((a,b)=>b-a)[0];if(!w)return null;const s=[...S.sleep].filter(x=>x<w).sort((a,b)=>b-a)[0];return s?w-s:null}
function healthToday(){const h=S.health[today()]||{};const st=h.steps||0;return{steps:st,kcal:h.kcal||Math.round(st*S.p.peso*0.0005)}}

function render(){
document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
document.getElementById('app').innerHTML=({hoy,estudio,deporte,comida,cuerpo,plan,extra,agenda})[tab]();
}

const lastDays=()=>Array.from({length:7},(_,i)=>dk(Date.now()-(6-i)*864e5));
const bars=(vals,color)=>{const m=Math.max(...vals,1),L=lastDays();return `<div style="display:flex;gap:6px;align-items:flex-end;height:96px">${vals.map((v,i)=>`<div style="flex:1;text-align:center;font-size:10px" class="mu">${Math.round(v*10)/10}<div style="height:${Math.round(v/m*60)}px;background:${color};border-radius:4px 4px 0 0;min-height:2px"></div>${new Date(L[i]+'T12:00').toLocaleDateString('es-ES',{weekday:'narrow'})}</div>`).join('')}</div>`};
const wmL=()=>S.water[today()]||0,wgL=()=>Math.round(S.p.peso*35);
function hoy(){
const sp=sum(sportToday(),'kcal'),h=healthToday(),inn=sum(foodToday(),'kcal');
const out=bmr()+sp+h.kcal,bal=inn-out,sl=sleepLast();
const w=S.wake.filter(x=>dk(x)===today()).sort((a,b)=>a-b)[0];
return `<h1>Hoy · ${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h1>
<div class="card"><h2>Fichar día</h2><div class="row"><button class="g" data-act="wake" style="flex:1">☀️ Me levanto</button><button class="b" data-act="sleep" style="flex:1">🌙 Me voy a dormir</button></div>
<p class="mu">${w?'Hoy te levantaste a las '+hm(w)+'. ':''}${sl?'Última noche dormiste '+dur(sl)+'.':'Ficha al acostarte y al levantarte para contar el sueño.'}</p></div>
<div class="card"><h2>Balance de calorías</h2><div class="big" style="color:${bal>0?'#d63b4a':'var(--ok)'}">${bal>0?'+':''}${bal} kcal</div>
<p class="mu">Comidas ${inn} − gasto ${out} (basal ${bmr()} + deporte ${sp} + actividad ${h.kcal})</p>
<div class="g2"><div class="stat">📚 Estudio<b>${dur(studyMs(today()))}</b></div><div class="stat">👟 Pasos<b>${h.steps}</b></div><div class="stat">🔥 Deporte<b>${sp} kcal</b></div><div class="stat">🍽️ Comido<b>${inn} kcal</b></div></div></div>
<div class="card"><h2>Objetivos de hoy</h2>
<div class="mu">🍽️ Calorías: ${inn} / ${S.goal} kcal</div><div class="bar"><i style="width:${Math.min(100,inn/S.goal*100)}%"></i></div>
<div class="row" style="margin-top:8px"><input id="goal" type="number" value="${S.goal}" style="flex:1"><button class="sm" data-act="goal">Cambiar objetivo</button></div>
<p class="mu" style="margin:14px 0 4px">💧 Agua: ${wmL()} / ${wgL()} ml (35 ml por kg)</p><div class="bar"><i style="width:${Math.min(100,wmL()/wgL()*100)}%;background:var(--ac2)"></i></div>
<div class="row" style="margin-top:8px"><button class="b sm" data-act="water" data-v="250">+250 ml</button><button class="b sm" data-act="water" data-v="500">+500 ml</button><button class="s sm" data-act="water" data-v="-250">−250</button></div></div>
<div class="card"><h2>Últimos 7 días</h2>
<p class="mu">Calorías comidas</p>${bars(lastDays().map(d=>sum(S.food.filter(x=>dk(x.t)===d),'kcal')),'var(--ac)')}
<p class="mu">Calorías quemadas en deporte</p>${bars(lastDays().map(d=>sum(S.sport.filter(x=>dk(x.t)===d),'kcal')),'#d63b4a')}
<p class="mu">Horas de estudio</p>${bars(lastDays().map(d=>studyMs(d)/36e5),'var(--ok)')}
<p class="mu">Agua (ml)</p>${bars(lastDays().map(d=>S.water[d]||0),'var(--ac2)')}</div>
${cuentaCard()}
<div class="card"><h2>Mis datos</h2><div class="g2"><div><label>Peso (kg)</label><input id="peso" type="number" step="0.1" value="${S.p.peso}"></div><div><label>Altura (cm)</label><input id="alt" type="number" value="${S.p.alt}"></div><div><label>Edad</label><input id="edad" type="number" value="${S.p.edad}"></div><div><label>Sexo</label><select id="sexo"><option value="m" ${S.p.sexo==='m'?'selected':''}>Hombre</option><option value="f" ${S.p.sexo==='f'?'selected':''}>Mujer</option></select></div></div>
<p><button data-act="perfil">Guardar datos</button></p>
<p class="mu">IMC: ${(S.p.peso/Math.pow(S.p.alt/100,2)).toFixed(1)} · Metabolismo basal: ${bmr()} kcal/día</p></div>`}

function estudio(){
const run=S.studyRun,days=[...new Set(S.study.map(x=>dk(x.s)))].sort().reverse().slice(0,7);
const wk=days.filter(d=>(Date.now()-new Date(d))<7*864e5).reduce((a,d)=>a+studyMs(d),0);
return `<h1>📚 Estudio</h1><div class="card" style="text-align:center">
<div class="big" data-live="study">${clock(run?Date.now()-run:0)}</div>
<p class="mu">${run?'Estudiando desde las '+hm(run):'Pulsa para empezar a estudiar'}</p>
<button class="${run?'r':'g'}" data-act="study" style="width:100%">${run?'⏹ Dejo de estudiar':'▶ Me pongo a estudiar'}</button></div>
<div class="g2"><div class="card stat">Hoy<b>${dur(studyMs(today()))}</b></div><div class="card stat">Últimos 7 días<b>${dur(wk)}</b></div></div>
<div class="card"><h2>Historial</h2>${days.map(d=>`<div class="li"><span>${fd(d+'T12:00')}</span><b>${dur(studyMs(d))}</b></div>`).join('')||'<p class="mu">Aún no hay sesiones.</p>'}</div>`}

function deporte(){
const r=S.sportRun,td=sportToday();
return `<h1>🏀 Baloncesto</h1><div class="card"><h2>Cronómetro</h2>
${r?`<div style="text-align:center"><div class="big" data-live="sport">${clock(Date.now()-r.s)}</div><p class="mu">${MET[r.type][1]} · ~<span data-live="sportk">${kcalSport(r.type,(Date.now()-r.s)/60000)}</span> kcal</p><button class="r" data-act="sportstop" style="width:100%">⏹ Terminar</button></div>`:
`<select id="stype">${Object.entries(MET).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select><p><button class="g" data-act="sportstart" style="width:100%">▶ Empezar ahora</button></p>`}</div>
<div class="card"><h2>Añadir a mano</h2><div class="g2"><select id="mtype">${Object.entries(MET).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select><input id="mmin" type="number" placeholder="Minutos"></div><p><button data-act="sportadd">Añadir</button></p>
<p class="mu">Calorías = MET × peso (${S.p.peso} kg) × horas. MET: entreno 6,5 · partido 8 · calentamiento 4,5.</p></div>
<div class="card"><h2>Hoy · ${sum(td,'kcal')} kcal</h2>${td.map(x=>`<div class="li"><span>${MET[x.type][1]} · ${x.min} min</span><b>${x.kcal} kcal</b></div>`).join('')||'<p class="mu">Sin sesiones hoy.</p>'}</div>`}

function comida(){
const td=foodToday(),tot=sum(td,'kcal');
const r=photo.res;
return `<h1>🍽️ Comida</h1><div class="card"><h2>Foto del plato</h2>
<input id="ph" type="file" accept="image/*" data-act="photo">
${photo.busy?'<p class="mu">Analizando foto…</p>':''}${photo.err?`<p style="color:#d63b4a">${photo.err}</p>`:''}
${r?`<div class="stat"><b>${r.nombre}</b>≈ ${r.kcal} kcal · P ${r.proteinas||'?'} g · C ${r.carbos||'?'} g · G ${r.grasas||'?'} g<div class="mu">${r.notas||''}</div></div><p><button class="g" data-act="photoadd">Añadir ${r.kcal} kcal</button></p>`:''}
<p class="mu">Es una estimación; revisa las cantidades.</p></div>
<div class="card"><h2>Añadir a mano</h2><div class="g2"><input id="fn" placeholder="Qué has comido"><input id="fk" type="number" placeholder="kcal"></div><p><button data-act="foodadd">Añadir</button></p></div>
<div class="card"><h2>Hoy · ${tot} kcal</h2>${td.map((x,i)=>`<div class="li"><span>${hm(x.t)} ${x.name}</span><span><b>${x.kcal}</b> <button class="s sm" data-act="fooddel" data-v="${S.food.indexOf(x)}">✕</button></span></div>`).join('')||'<p class="mu">Nada registrado.</p>'}</div>`}

function cuerpo(){
const h=S.health[today()]||{},ps=[...S.period].sort((a,b)=>a.s-b.s),last=ps[ps.length-1];
let cyc=28;if(ps.length>1){const d=ps.slice(1).map((x,i)=>(x.s-ps[i].s)/864e5);cyc=Math.round(d.reduce((a,b)=>a+b,0)/d.length)}
const next=last?last.s+cyc*864e5:null,open=last&&!last.e;
const ws=[...S.weights].slice(-6).reverse();
return `<h1>❤️ Cuerpo y salud</h1>
<div class="card"><h2>Apple Salud (pasos y calorías de hoy)</h2><div class="g2"><div><label>Pasos</label><input id="hs" type="number" value="${h.steps||''}"></div><div><label>Calorías activas</label><input id="hk" type="number" value="${h.kcal||''}"></div></div>
<p><button data-act="health">Guardar</button></p>
<p class="mu">Un HTML no puede leer Apple Salud directamente (solo apps nativas). Copia aquí los datos desde la app Salud, o usa el botón de exportar para llevarte todo en JSON.</p></div>
<div class="card"><h2>Peso</h2><div class="row"><input id="wn" type="number" step="0.1" placeholder="kg" style="flex:1"><button data-act="weight">Guardar</button></div>${ws.map(x=>`<div class="li"><span>${fd(x.d)}</span><b>${x.w} kg</b></div>`).join('')}</div>
<div class="card"><h2>Medidas corporales (cm)</h2><div class="g2"><div><label>Cintura</label><input id="mc" type="number" step="0.1"></div><div><label>Pecho</label><input id="mp" type="number" step="0.1"></div><div><label>Brazo</label><input id="mb" type="number" step="0.1"></div><div><label>Muslo</label><input id="mm" type="number" step="0.1"></div></div><p><button data-act="meas">Guardar medidas</button></p>${[...S.meas].slice(-3).reverse().map(x=>`<div class="li"><span>${fd(x.d)}</span><span>cint ${x.c||'-'} · pecho ${x.p||'-'} · brazo ${x.b||'-'} · muslo ${x.m||'-'}</span></div>`).join('')}</div>
<div class="card"><h2>Regla</h2><div class="row"><button data-act="pstart" style="flex:1" ${open?'disabled':''}>🩸 Me ha venido</button><button class="s" data-act="pend" style="flex:1" ${open?'':'disabled'}>Terminó</button></div>
<p class="mu">${last?'Último inicio: '+fd(last.s)+(open?' (en curso)':'')+' · ciclo medio: '+cyc+' días · próxima aprox.: '+fd(next):'Sin registros todavía.'}</p>
${ps.slice(-5).reverse().map(x=>`<div class="li"><span>${fd(x.s)}${x.e?' → '+fd(x.e):''}</span><span>${x.e?Math.round((x.e-x.s)/864e5)+1+' días':'…'}</span></div>`).join('')}</div>
<div class="card"><h2>Datos</h2><button class="b" data-act="export">⬇ Exportar todo (JSON)</button></div>`}

const T=o=>S.train[dk(Date.now()+o*864e5)]||'descanso';
const TI={descanso:'😴 Descanso',entreno:'🏀 Entreno',partido:'🏆 Partido'};
let adv={};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const eur=v=>v.toFixed(2).replace('.',',')+' €';
const d0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const sumExp=a=>S.exp.filter(x=>x.t>=a).reduce((s,x)=>s+x.amt,0);
const CATS=['Comida','Transporte','Ocio','Deporte','Ropa','Otros'];
function rules(){const w=S.p.peso,h=T(0),m=T(1),act=h!=='descanso',L=[];
const c=h==='partido'?7:h==='entreno'?6:m==='partido'?7:m==='entreno'?5:4;
L.push(`Carbohidratos: ~${Math.round(c*w)} g hoy (arroz, pasta, patata, pan, avena, fruta).`);
L.push(`Proteína: ~${Math.round(1.6*w)} g repartida en 3-4 comidas (huevo, pollo, pescado, lácteos, legumbres).`);
L.push(`Agua: ${wgL()} ml al día${act?' + 500 ml por cada hora de juego':''}.`);
if(act){L.push('2-4 h antes: carbohidrato + algo de proteína, poca grasa y fibra (arroz con pollo, pasta con tomate).');L.push('30-60 min antes, si te hace falta: plátano, dátiles o tostada con miel.');
if(h==='partido')L.push('Durante el partido: agua y fruta o bebida con sales; no pruebes nada nuevo.');
L.push('En 1-2 h después: 20-30 g de proteína + carbohidratos (batido de leche con plátano, huevos con pan, yogur con fruta y cereales).')}
else L.push('Día de descanso: más verdura, legumbres y pescado, grasas buenas (aceite de oliva, frutos secos) y carbohidratos moderados.');
if(h!=='partido'&&m==='partido')L.push('Mañana hay partido: cena alta en carbohidratos (pasta o arroz), poca grasa y acuéstate pronto.');
else if(h==='descanso'&&m==='entreno')L.push('Mañana entrenas: incluye una buena ración de carbohidratos en la cena.');
L.push('Sueño: 8-10 h, sobre todo la noche antes de un partido.');return L}
async function askAdvice(){adv={busy:true};render();
try{const s=await claude.use('sample');if(!s)throw{message:'No disponible en esta vista.'};
const sch=Array.from({length:7},(_,i)=>fd(Date.now()+i*864e5)+': '+T(i)).join('; ');

function dietPlan(){const p=S.p,D=S.diet,sp7=S.sport.filter(x=>x.t>Date.now()-7*864e5).reduce((s,x)=>s+x.kcal,0)/7;
const tdee=Math.round(bmr()*1.3+sp7),minor=p.edad<18,mode=minor&&D.mode==='bajar'?'mantener':D.mode;
const def=Math.round(D.rate*7700/7);let tgt=tdee,burn=0,prot=1.6;
if(mode==='bajar'){tgt=Math.max(bmr(),tdee-def);burn=Math.max(0,def-(tdee-tgt));prot=1.8}
if(mode==='subir'){tgt=tdee+300;prot=2}
return{tdee,tgt,burn,prot,mode,def,minor}}
function dietCard(){const D=S.diet,r=dietPlan();
return `<div class='card'><h2>Objetivo de dieta</h2><div class='row'>${[['mantener','Mantener'],['bajar','Adelgazar'],['subir','Subir músculo']].map(([k,l])=>`<button class='${D.mode===k?'':'s'} sm' data-act='mode' data-v='${k}'>${l}</button>`).join('')}</div>
${D.mode==='bajar'?`<div class='row' style='margin-top:8px'>${[0.5,1,1.5].map(x=>`<button class='${D.rate===x?'b':'s'} sm' data-act='rate' data-v='${x}'>${x} kg/sem</button>`).join('')}</div>`:''}
${r.minor&&D.mode==='bajar'?`<p style='color:#d63b4a'>Tu edad en Mis datos es ${S.p.edad}: siendo menor de 18 no te propongo adelgazar por tu cuenta, así que te muestro mantenimiento. Si quieres bajar de peso, habla con un médico.</p>`:''}
<div class='g2' style='margin-top:10px'><div class='stat'>Gasto diario estimado<b>${r.tdee} kcal</b></div><div class='stat'>Comer al día<b>${r.tgt} kcal</b></div></div>
<p>Proteína: ~${Math.round(r.prot*S.p.peso)} g/día.</p>
${r.mode==='bajar'?`<p>Para ${D.rate} kg/semana hace falta un déficit de ~${r.def} kcal/día. Comiendo como mínimo tu metabolismo basal (${bmr()} kcal), tendrías que quemar ~${r.burn} kcal extra al día${r.burn?` (≈ ${Math.round(r.burn/(6.5*S.p.peso/60))} min de entreno de baloncesto)`:''}.</p>${D.rate>1?`<p style='color:#d63b4a'>Más de 1 kg por semana es un ritmo muy alto: riesgo de perder músculo, rendir peor y lesionarte. Consúltalo con un médico o nutricionista deportivo.</p>`:''}`:''}
${r.mode==='subir'?`<p>Superávit de ~300 kcal/día (≈ 0,25-0,5 kg/semana). Entrena fuerza 3-4 días y duerme 8-10 h. Tus entrenos ya cuentan en el gasto.</p>`:''}
<p class='mu'>Estimación (Mifflin-St Jeor, 7700 kcal por kg). No sustituye a un profesional.</p></div>`}
const TT={tarea:'✅ Tarea',alarma:'⏰ Alarma',despertador:'🌅 Despertador diario',evento:'📅 Evento'};
const icsT=s=>s.replace(/[-:]/g,'').slice(0,13)+'00';
function mkIcs(x){const w=x.when||dk(Date.now())+'T08:00',e=new Date(new Date(w).getTime()+36e5),P=n=>String(n).padStart(2,'0'),
end=e.getFullYear()+P(e.getMonth()+1)+P(e.getDate())+'T'+P(e.getHours())+P(e.getMinutes())+'00';

return `<h1>✅ Agenda</h1><div class='card'><h2>Nueva tarea, alarma o evento</h2><input id='tt' placeholder='Título'><div class='g2' style='margin-top:8px'><input id='tw' type='datetime-local'><select id='ty'>${Object.entries(TT).map(([k,v])=>`<option value='${k}'>${v}</option>`).join('')}</select></div><p><button data-act='taskadd'>Añadir</button></p><p class='mu'>Una web no puede sonar como alarma. Pulsa 📲 para bajar un archivo .ics, ábrelo desde Archivos y elige «Añadir a Calendario»: así tendrá el aviso de Apple.</p></div>
<div class='card'><h2>Pendiente</h2>${L.map(x=>`<div class='li' style='align-items:center'><span style='${x.done?'text-decoration:line-through;opacity:.5':''}'>${TT[x.type].slice(0,2)} ${esc(x.title)}<br><span class='mu'>${x.when?x.when.replace('T',' '):'sin fecha'}</span></span><span><button class='s sm' data-act='taskdone' data-v='${x.id}'>✔</button> <button class='s sm' data-act='ics' data-v='${x.id}'>📲</button> <button class='s sm' data-act='taskdel' data-v='${x.id}'>✕</button></span></div>`).join('')||`<p class='mu'>Nada por ahora.</p>`}</div>
<div class='card'><h2>Atajos directos</h2><p class='mu'>Añade al enlace de esta página #hoy, #estudio, #deporte, #comida, #cuerpo, #plan, #extra o #agenda y guárdalo en tu pantalla de inicio.</p></div>`}
function plan(){return `<h1>🗓️ Plan de entrenos</h1><div class='card'><h2>Próximos 7 días · toca para cambiar</h2>${Array.from({length:7},(_,i)=>`<div class='li' style='align-items:center'><span>${new Date(Date.now()+i*864e5).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}</span><button class='s sm' data-act='train' data-v='${i}'>${TI[T(i)]}</button></div>`).join('')}</div>
${dietCard()}
<div class='card'><h2>Qué comer hoy (${TI[T(0)]})</h2>${rules().map(x=>`<p style='margin:6px 0'>• ${x}</p>`).join('')}<p class='mu'>Orientativo; no sustituye a un nutricionista.</p></div>
<div class='card'><h2>Consejo personalizado</h2><button class='b' data-act='advice'>✨ Pedir consejo a Claude</button>${adv.busy?`<p class='mu'>Pensando…</p>`:''}${adv.err?`<p style='color:#d63b4a'>${adv.err}</p>`:''}${adv.text?`<p style='white-space:pre-wrap'>${adv.text}</p>`:''}</div>`}
function extra(){const L=lastDays(),ph=S.phone[today()]||0,avg=L.reduce((a,d)=>a+(S.phone[d]||0),0)/7;
const mon=d0();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const mes=d0();mes.setDate(1);
const m30=Date.now()-30*864e5,by=CATS.map(c=>[c,S.exp.filter(x=>x.t>=m30&&x.cat===c).reduce((s,x)=>s+x.amt,0)]),mx=Math.max(...by.map(x=>x[1]),1);
return `<h1>💶 Gastos y móvil</h1>
<div class='card'><h2>Gastos</h2><div class='g2'><div class='stat'>Hoy<b>${eur(sumExp(+d0()))}</b></div><div class='stat'>Esta semana<b>${eur(sumExp(+mon))}</b></div><div class='stat'>Este mes<b>${eur(sumExp(+mes))}</b></div><div class='stat'>Últimos 30 días<b>${eur(sumExp(m30))}</b></div></div>
<div class='g2' style='margin-top:10px'><input id='ea' type='number' step='0.01' placeholder='€'><select id='ec'>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><input id='en' placeholder='Concepto (opcional)' style='margin-top:8px'><p><button data-act='expadd'>Añadir gasto</button></p>
${by.map(x=>`<div class='mu'>${x[0]} · ${eur(x[1])}</div><div class='bar'><i style='width:${x[1]/mx*100}%'></i></div>`).join('')}
${[...S.exp].reverse().slice(0,8).map(x=>`<div class='li'><span>${fd(x.t)} ${x.cat}${x.note?' · '+esc(x.note):''}</span><span><b>${eur(x.amt)}</b> <button class='s sm' data-act='expdel' data-v='${S.exp.indexOf(x)}'>✕</button></span></div>`).join('')}</div>
<div class='card'><h2>Uso del móvil</h2><div class='row'><input id='ph2' type='number' step='0.1' placeholder='Horas hoy' value='${ph?(ph/60).toFixed(1):''}' style='flex:1'><button data-act='phone'>Guardar</button></div><p class='mu'>Hoy: ${dur(ph*6e4)} · media 7 días: ${dur(avg*6e4)}</p>${bars(L.map(d=>(S.phone[d]||0)/60),'#8a5cf6')}<p class='mu'>Horas por día. Una web no puede leer Tiempo en pantalla: míralo en Ajustes y escríbelo aquí.</p></div>
<div class='card'><h2>Sincronizar con la app nativa</h2><label>Importar JSON exportado desde la app del iPhone</label><input id='imp' type='file' accept='.json,application/json'></div>`}

try{const d=JSON.parse(await e.target.files[0].text());
['food','sport','exp','wake','sleep','study','weights','period','meas'].forEach(k=>{if(Array.isArray(d[k]))S[k]=[...S[k],...d[k].filter(x=>!S[k].some(y=>JSON.stringify(y)===JSON.stringify(x)))]});

 if(!window.cloudOK)return `<div class="card"><h2>Cuenta</h2><p class="mu">Nube no disponible (sin configurar o sin conexión). Tus datos se guardan solo en este dispositivo.</p></div>`;

async function cloudAct(a){cu.msg='';try{if(a==='logout')await window.cloud.logout();else await window.cloud[a](document.getElementById('em').value.trim(),document.getElementById('pw').value)}catch(e){cu.msg=e.message||'Error';render()}}

document.addEventListener('click',async e=>{
const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
const a=el.dataset.act,v=el.dataset.v,n=Date.now();
if(a==='tab')tab=v;
else if(a==='wake')S.wake.push(n);
else if(a==='sleep')S.sleep.push(n);
else if(a==='perfil')S.p={peso:num('peso')||70,alt:num('alt')||175,edad:num('edad')||17,sexo:document.getElementById('sexo').value};
else if(a==='study'){if(S.studyRun){S.study.push({s:S.studyRun,e:n});S.studyRun=null}else S.studyRun=n}
else if(a==='sportstart')S.sportRun={type:document.getElementById('stype').value,s:n};
else if(a==='sportstop'){const r=S.sportRun,m=Math.max(1,Math.round((n-r.s)/60000));S.sport.push({t:n,type:r.type,min:m,kcal:kcalSport(r.type,m)});S.sportRun=null}
else if(a==='sportadd'){const m=num('mmin'),t=document.getElementById('mtype').value;if(m>0)S.sport.push({t:n,type:t,min:m,kcal:kcalSport(t,m)})}
else if(a==='foodadd'){const k=num('fk'),nm=document.getElementById('fn').value||'Comida';if(k>0)S.food.push({t:n,name:nm,kcal:k})}
else if(a==='fooddel')S.food.splice(+v,1);
else if(a==='photoadd'){S.food.push({t:n,name:photo.res.nombre,kcal:photo.res.kcal});photo.res=null}
else if(a==='health')S.health[today()]={steps:num('hs'),kcal:num('hk')};
else if(a==='weight'){const w=num('wn');if(w>0){S.weights.push({d:n,w});S.p.peso=w}}
else if(a==='goal')S.goal=num('goal')||2200;
else if(a==='expadd'){const m=num('ea');if(m>0)S.exp.push({t:n,cat:document.getElementById('ec').value,amt:m,note:document.getElementById('en').value})}
else if(a==='expdel')S.exp.splice(+v,1);
else if(a==='phone')S.phone[today()]=Math.round(num('ph2')*60);
else if(a==='train'){const k=dk(n+ +v*864e5),o=['descanso','entreno','partido'];S.train[k]=o[(o.indexOf(S.train[k]||'descanso')+1)%3]}
else if(a==='advice'){askAdvice();return}
else if(a==='login'||a==='signup'||a==='logout'){cloudAct(a);return}
else if(a==='mode'){S.diet.mode=v;S.goal=dietPlan().tgt}
else if(a==='rate'){S.diet.rate=+v;S.goal=dietPlan().tgt}
else if(a==='taskadd'){const t=document.getElementById('tt').value.trim();if(t)S.tasks.push({id:n,title:t,when:document.getElementById('tw').value,type:document.getElementById('ty').value,done:false})}
else if(a==='taskdone'){const x=S.tasks.find(y=>y.id==v);if(x)x.done=!x.done}
else if(a==='taskdel')S.tasks=S.tasks.filter(y=>y.id!=v);
else if(a==='ics'){const x=S.tasks.find(y=>y.id==v);try{const d=await claude.use('downloads');if(d&&x)await d.save({filename:'aviso-'+x.id+'.ics',data:mkIcs(x)})}catch(err){}return}
else if(a==='water')S.water[today()]=Math.max(0,wmL()+ +v);
else if(a==='meas')S.meas.push({d:n,c:num('mc'),p:num('mp'),b:num('mb'),m:num('mm')});
else if(a==='pstart')S.period.push({s:n});
else if(a==='pend'){const l=S.period[S.period.length-1];if(l)l.e=n}
else if(a==='export'){try{const d=await claude.use('downloads');if(d)await d.save({filename:'mi-diario.json',data:JSON.stringify(S,null,2)});else alert('Descarga no disponible aquí.')}catch(x){}return}
save();render()});

<script type="module">
const C=window.FB_CONFIG;
if(C&&C.apiKey&&!C.apiKey.startsWith('PEGA')){try{
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=initializeApp(C),auth=A.getAuth(app),db=F.getFirestore(app);
 const M={'auth/invalid-credential':'Correo o contraseña incorrectos','auth/invalid-email':'Correo no válido','auth/email-already-in-use':'Ese correo ya tiene cuenta: pulsa Entrar','auth/weak-password':'La contraseña necesita 6 caracteres o más','auth/missing-password':'Escribe la contraseña','auth/network-request-failed':'Sin conexión','auth/unauthorized-domain':'Dominio no autorizado en Firebase (Authentication > Settings > Authorized domains)'};
 const wrap=f=>async(...a)=>{try{await f(...a)}catch(e){throw{message:M[e.code]||e.message}}};
 window.cloud={login:wrap((e,p)=>A.signInWithEmailAndPassword(auth,e,p)),signup:wrap((e,p)=>A.createUserWithEmailAndPassword(auth,e,p)),logout:()=>A.signOut(auth)};
 let uid=null,timer=null;const ref=()=>F.doc(db,'users',uid);
 window.cloudPush=()=>{if(!uid)return;clearTimeout(timer);timer=setTimeout(async()=>{try{const s=window.App.get();await F.setDoc(ref(),{data:JSON.stringify(s),t:s._t||Date.now()});window.App.msg('Sincronizado '+new Date().toLocaleTimeString('es-ES'))}catch(e){window.App.msg('Sin conexión: se sincronizará en el próximo guardado')}},800)};
 window.cloudOK=true;
 A.onAuthStateChanged(auth,async u=>{uid=u?u.uid:null;window.App.user(u?u.email:null);if(!u)return;
  try{const snap=await F.getDoc(ref()),loc=window.App.get();
   if(snap.exists()&&(snap.data().t||0)>(loc._t||0)){window.App.replace(JSON.parse(snap.data().data));window.App.msg('Datos cargados de tu cuenta')}
   else window.cloudPush()}catch(e){window.App.msg('No se pudo leer la nube: '+e.message)}});
 window.App.user(null);
